<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>معرض بدر الذكي لحفظ الصور والمستندات</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --border-color: #334155;
            --danger-color: #ef4444;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        header h1 {
            margin: 0 0 10px 0;
            font-size: 2.2rem;
            color: #60a5fa;
        }

        header p {
            color: #94a3b8;
            margin: 0;
        }

        .control-panel {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            border: 1px solid var(--border-color);
        }

        .upload-group, .filter-group {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        input[type="file"], input[type="text"], select {
            background: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
            outline: none;
        }

        button {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .item-card {
            background: var(--card-bg);
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            transition: transform 0.2s;
        }

        .item-card:hover {
            transform: translateY(-4px);
        }

        .preview-container {
            width: 100%;
            height: 180px;
            background: #090d16;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        .preview-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            cursor: pointer;
        }

        .doc-preview {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #93c5fd;
            text-decoration: none;
            width: 100%;
            height: 100%;
            background: #1e293b;
            padding: 15px;
            text-align: center;
        }

        .doc-preview svg {
            width: 48px;
            height: 48px;
            margin-bottom: 8px;
            fill: #60a5fa;
        }

        .item-info {
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .item-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .item-title {
            font-size: 0.9rem;
            color: #e2e8f0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 150px;
        }

        .tag-badge {
            background: #334155;
            color: #93c5fd;
            padding: 3px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
        }

        .actions-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 4px;
            border-top: 1px solid var(--border-color);
            padding-top: 8px;
        }

        .btn-sm {
            padding: 5px 10px;
            font-size: 0.75rem;
            border-radius: 6px;
        }

        .download-btn {
            background: #10b981;
        }
        .download-btn:hover {
            background: #059669;
        }

        .delete-btn {
            background: var(--danger-color);
        }
        .delete-btn:hover {
            background: #dc2626;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>معرض بدر الذكي لحفظ الصور والمستندات</h1>
            <p>إدارة وتنظيم صورك وملفاتك المهنية والشخصية بكل أمان وسلاسة</p>
        </header>

        <div class="control-panel">
            <div class="upload-group">
                <input type="file" id="fileInput" accept="image/*,.pdf,.doc,.docx,.xls,.xlsx,.txt">
                <input type="text" id="tagInput" placeholder="أدخل التصنيف (مثال: فواتير، مشاريع)">
                <button id="uploadBtn">رفع وحفظ</button>
            </div>
            <div class="filter-group">
                <input type="text" id="searchInput" placeholder="ابحث في التصنيفات...">
            </div>
        </div>

        <div class="gallery-grid" id="galleryGrid"></div>
    </div>

    <script>
        const fileInput = document.getElementById('fileInput');
        const tagInput = document.getElementById('tagInput');
        const uploadBtn = document.getElementById('uploadBtn');
        const galleryGrid = document.getElementById('galleryGrid');
        const searchInput = document.getElementById('searchInput');

        let itemsData = JSON.parse(localStorage.getItem('badrSmartGallery')) || [];

        function renderGallery(filter = '') {
            galleryGrid.innerHTML = '';
            
            const filteredItems = itemsData.filter(item => 
                item.tag.toLowerCase().includes(filter.toLowerCase()) || 
                item.name.toLowerCase().includes(filter.toLowerCase())
            );

            if (filteredItems.length === 0) {
                galleryGrid.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: #94a3b8;">لا توجد ملفات محفوظة مطابقة للبحث.</p>';
                return;
            }

            filteredItems.forEach((item) => {
                const card = document.createElement('div');
                card.className = 'item-card';
                
                let previewHTML = '';
                if (item.type.startsWith('image/')) {
                    previewHTML = `<div class="preview-container"><img src="${item.src}" alt="${item.name}" onclick="window.open('${item.src}')"></div>`;
                } else {
                    previewHTML = `
                        <div class="preview-container">
                            <a href="${item.src}" download="${item.name}" class="doc-preview">
                                <svg viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                                <span>مستند / ملف</span>
                            </a>
                        </div>
                    `;
                }

                card.innerHTML = `
                    ${previewHTML}
                    <div class="item-info">
                        <div class="item-meta">
                            <span class="item-title" title="${item.name}">${item.name}</span>
                            <span class="tag-badge">${item.tag || 'عام'}</span>
                        </div>
                        <div class="actions-row">
                            <a href="${item.src}" download="${item.name}" class="button btn-sm download-btn" style="text-decoration:none; color:white; display:inline-block;">تحميل</a>
                            <button class="delete-btn btn-sm" onclick="deleteItem(${item.id})">حذف</button>
                        </div>
                    </div>
                `;
                galleryGrid.appendChild(card);
            });
        }

        uploadBtn.addEventListener('click', function() {
            const file = fileInput.files[0];
            if (!file) {
                alert('الرجاء اختيار ملف أو صورة أولاً!');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                const newItem = {
                    id: Date.now(),
                    name: file.name,
                    type: file.type,
                    src: e.target.result,
                    tag: tagInput.value.trim() || 'عام'
                };

                itemsData.push(newItem);
                localStorage.setItem('badrSmartGallery', JSON.stringify(itemsData));
                
                fileInput.value = '';
                tagInput.value = '';
                renderGallery();
            };
            reader.readAsDataURL(file);
        });

        window.deleteItem = function(id) {
            itemsData = itemsData.filter(item => item.id !== id);
            localStorage.setItem('badrSmartGallery', JSON.stringify(itemsData));
            renderGallery(searchInput.value);
        };

        searchInput.addEventListener('input', function(e) {
            renderGallery(e.target.value);
        });

        renderGallery();
    </script>
</body>
</html>
